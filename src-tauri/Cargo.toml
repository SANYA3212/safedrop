[package]
name = "safedrop"
version = "0.3.40"
description = "SafeDrop — P2P обмен файлами через Radmin VPN"
edition = "2021"

# Приложение — библиотека (lib.rs): Windows запускает её из main.rs,
# Android подгружает как libsafedrop_lib.so
[lib]
name = "safedrop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# вход в аккаунт по коду: ключ передаётся только тому, кто знает код (SPAKE2)
spake2 = "0.4"
hmac = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
local-ip-address = "0.6"
futures = "0.3"
anyhow = "1"
base64 = "0.22"
tauri-plugin-notification = "2"
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
minisign-verify = "0.2"

# только компьютер: окна выбора файлов, второй запуск, уведомления системы,
# обновления с GitHub. На Android этого нет (там свой интерфейс и APK)
[target.'cfg(not(target_os = "android"))'.dependencies]
open = "5"
rfd = "0.15"
tauri-plugin-single-instance = "2"
notify-rust = "4"
# проверка сертификата GitHub хранилищем Windows (обновления); уже есть в сборке через quinn
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
# та же версия, что у wry: нужен доступ к настройкам WebKit (WebRTC)
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
walkdir = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]


[target.'cfg(target_os = "android")'.dependencies]
# папки приложения и «Загрузки» берутся у Android (через JNI)
jni = "0.21"
ndk-context = "0.1"
