[package]
name = "safedrop"
version = "0.3.24"
description = "SafeDrop вЂ” P2P РѕР±РјРµРЅ С„Р°Р№Р»Р°РјРё С‡РµСЂРµР· Radmin VPN"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"
local-ip-address = "0.6"
ipconfig = "0.3"
futures = "0.3"
anyhow = "1"
rfd = "0.15"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
notify-rust = "4"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

