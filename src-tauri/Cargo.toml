[package]
name = "safedrop"
version = "0.3.30"
description = "SafeDrop — P2P обмен файлами через Radmin VPN"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"
local-ip-address = "0.6"
futures = "0.3"
anyhow = "1"
rfd = "0.15"
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
# та же версия, что у wry: нужен доступ к настройкам WebKit (WebRTC)
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

