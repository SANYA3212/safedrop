[package]
name = "safedrop-shell"
version = "0.1.0"
description = "SafeDrop Explorer context menu (IExplorerCommand COM handler)"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.62", features = [
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
] }
windows-core = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
lto = true
