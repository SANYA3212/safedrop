[package]
name = "safedrop-server"
version = "0.1.0"
edition = "2021"
description = "SafeDrop relay server: forwards encrypted connections between SafeDrop clients and relays calls (TURN)"
license-file = "../LICENSE"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
turn = "0.17"
webrtc-util = { version = "0.17", default-features = false, features = ["conn", "vnet"] }
async-trait = "0.1"
ring = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
